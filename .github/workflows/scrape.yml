name: Daily Bank Rates Scrape

on:
  schedule:
    # 3:00 AM Riyadh time = 00:00 UTC (Riyadh is UTC+3)
    - cron: "0 0 * * *"
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install scipy playwright
          playwright install chromium --with-deps

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated rates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rates.json data/history.jsonl
          # Only commit if there are actual changes
          git diff --staged --quiet || git commit -m "chore: update bank rates $(date -u +%Y-%m-%d)"

      - name: Sync with remote before push
        run: |
          git fetch origin main
          git rebase origin/main || git rebase --abort

      - name: Push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
